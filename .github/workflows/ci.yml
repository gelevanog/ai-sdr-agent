name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

  backend-test:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No API keys: the offline model answers every task; providers are tested against recorded requests.
      TEST_DATABASE_URL: postgresql://scout:scout@localhost:5432/scout_test
      REQUIRE_TEST_DB: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=report.xml

      - name: CLI smoke run (offline model)
        env:
          SCOUT_DATABASE_URL: postgresql://scout:scout@localhost:5432/scout_test
          SCOUT_LLM_PROVIDER: fake
          SCOUT_LLM_LEDGER: ""
          SCOUT_RESULTS_DIR: /tmp/results
        run: |
          mkdir -p /tmp/results
          uv run scout seed --reset
          uv run scout pipeline -a 1 -a 2 -a 24
          uv run scout queue
          uv run scout approve 1 --reviewer ci
          uv run scout eval claims --name ci
          uv run scout eval compliance --name ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report.xml

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: scout-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: scout-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
