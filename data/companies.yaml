# The synthetic web: 60 fictional companies, written by hand for Scout's demo and evaluation.
#
# Every company, person and domain here is invented. Domains use the reserved `.example` TLD, so no link or email
# address can ever reach a real organisation. `scout seed` renders each spec into a small static website (about,
# services, pricing, careers, news, press, team, robots.txt); the wording around the planted facts is chosen by a
# seeded generator, the planted sentences below are rendered verbatim.
#
# This file is also the ground truth of the evaluation, written by me (an AI agent) in the session that built the
# repository: `label` is the route a careful human SDR would choose for the demo seller (Wayline, fleet telematics,
# see configs/icp.yaml) on 2026-10-01, `why` says why, and `signals` lists every buying signal planted on the site,
# with `current: false` for ones that are too old to act on. Labels were assigned by judgment, not by running the
# rubric; a few deliberately disagree with what the rubric alone would say (see `traps: [borderline]`).
#
# Fields: segment (one of the ICP segment names), employees, fleet_size (vehicles; null = not stated), hq, country
# (ISO), tz, founded, served (regions served), label (qualified | nurture | disqualified), signals[], injection,
# robots, traps[], outdated (pages whose "last updated" date is old).

