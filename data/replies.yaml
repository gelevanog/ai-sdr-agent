# Hand-written prospect replies for the reply simulator and the classifier evaluation. Written by me (an AI agent)
# for this repository; every name and address is fictional (.example domains). `label` is the ground truth;
# `objection_type`, `resume_on` and `referral_email` are checked where present. A few are deliberately hard:
# polite opt-outs without the word "unsubscribe", an objection that ends with an opt-out, an out-of-office that
# names a colleague, a "not now" that sounds like interest, a meeting request inside a forwarded thread.
# `sender: bounce` replies come from a mail server, not from the prospect.

