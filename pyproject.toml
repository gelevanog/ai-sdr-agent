[project]
name = "scout"
version = "0.1.0"
description = "Scout: an AI SDR that researches accounts with citations, qualifies them against your ICP, drafts outreach where every personal detail is sourced, and waits for a human to approve it. Capture-only sending, reply classification, CRM sync, compliance controls."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.13",
    "fastapi",
    "httpx",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "rich",
    "structlog",
    "typer",
    "tzdata",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff", "types-pyyaml"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs PostgreSQL (TEST_DATABASE_URL); skipped otherwise unless REQUIRE_TEST_DB=1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC", "S608"]
# E501: `ruff format` owns line length; what it cannot wrap are long SQL, regex and prompt strings, kept intact on purpose.
ignore = ["E501", "TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["scout"]
